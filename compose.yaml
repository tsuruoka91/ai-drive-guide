services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_drive_guide_development}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    command: ["./bin/rails", "server", "-b", "0.0.0.0"]
    ports:
      - "3000:3000"
    volumes:
      - .:/rails
      - bundle_cache:/usr/local/bundle
    environment:
      RAILS_ENV: development
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-ai_drive_guide_development}
      RAILS_MAX_THREADS: ${RAILS_MAX_THREADS:-5}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6-luna}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      NOMINATIM_USER_AGENT: ${NOMINATIM_USER_AGENT:-ai-drive-guide/0.1}
      OVERPASS_USER_AGENT: ${OVERPASS_USER_AGENT:-ai-drive-guide/0.1}
      WIKIPEDIA_USER_AGENT: ${WIKIPEDIA_USER_AGENT:-ai-drive-guide/0.1}
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  bundle_cache:
